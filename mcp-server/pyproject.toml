[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "balsumulu-mcp-server"
version = "0.1.0"
description = "MCP server for the Balsumulu AI Engineering harness"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
balsumulu-mcp = "src.server:main"
